name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        # Pinned below floating `stable`: clippy 1.99 trips a false-positive
        # `double_must_use` on `#[async_trait]` (rust-lang/rust-clippy#17529),
        # fixed in clippy 1.100 which is not stable yet. Bump once it is.
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --locked

      - name: Validate (test -> check -> clippy)
        run: just validate

      - name: Check offline query caches (sqlite + postgres)
        run: just sqlx-prepare-check
