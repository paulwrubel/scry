name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --locked

      - name: Validate (test -> check -> clippy)
        run: just validate

      - name: Check offline query caches (sqlite + postgres)
        run: just sqlx-prepare-check
