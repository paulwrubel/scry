name: CI

# Automatic runs disabled. Uncomment the push/pull_request triggers below to
# re-enable them (and remove workflow_dispatch if you want no runs at all).
on:
  # push:
  #   branches:
  #     - main
  # pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        # Pinned below floating `stable`: clippy 1.99 trips a false-positive
        # `double_must_use` on `#[async_trait]` (rust-lang/rust-clippy#17529),
        # fixed in clippy 1.100 which is not stable yet. Bump once it is.
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --locked

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: cd ui && npm ci

      - name: Check generated bindings
        run: just check-bindings

      - name: Check shared fixtures
        run: just check-fixtures

      - name: Validate Rust (test -> check -> clippy)
        run: just cargo-test cargo-check cargo-clippy

      - name: Lint UI
        run: cd ui && npm run lint

      - name: Check UI formatting
        run: cd ui && npm run prettier-check

      - name: Type-check UI
        run: cd ui && npm run type-check

      - name: Test UI
        run: cd ui && npm test

      - name: Check offline query cache (postgres)
        run: just sqlx-prepare-check
