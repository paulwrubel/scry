name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation linker (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          BINARY="scry"
          if [ "${{ runner.os }}" = "Windows" ]; then
            BINARY="scry.exe"
          fi
          cd target/${{ matrix.target }}/release
          tar czf "${{ github.workspace }}/scry-${{ matrix.target }}.tar.gz" "$BINARY"
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scry-${{ matrix.target }}
          path: scry-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate checksums
        run: |
          sha256sum scry-*/scry-*.tar.gz > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            scry-*/scry-*.tar.gz
            checksums.txt
          body: |
            ## Install

            ```sh
            curl -fsSL https://raw.githubusercontent.com/paulwrubel/scry/main/install.sh | sh
            ```

            See the [README](https://github.com/paulwrubel/scry#installation) for all installation options.
          generate_release_notes: true
