name: scry-dev

services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scry
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - scry-pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scry"]
      interval: 1s
      timeout: 5s
      retries: 30

volumes:
  scry-pg-data:
