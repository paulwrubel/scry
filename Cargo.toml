[package]
name = "scry"
version = "0.27.0"
edition = "2024"

[features]
default = ["embed-ui"]
ts = ["dep:ts-rs", "scry-core/ts"]
embed-ui = ["dep:include_dir"]

[dependencies]
anstream = "1"
anstyle = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
uuid = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "postgres",
    "chrono",
    "json",
    "migrate",
    "tls-rustls",
    "uuid",
] }
num_enum = "0.7.6"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = [
    "cookie-key-expansion",
    "cookie-signed",
    "typed-header",
] }
tower-http = { version = "0.6", features = ["cors"] }
subtle = "2"
sha2 = "0.10"
time = "0.3"
scry-core = { path = "crates/scry-core" }
ts-rs = { version = "12", optional = true, features = [
    "chrono-impl",
    "uuid-impl",
] }
include_dir = { version = "0.7.4", optional = true }

[workspace]
members = ["crates/scry-core"]
resolver = "3"

[dev-dependencies]
assert_fs = "1.1.4"
tower = { version = "0.5", features = ["util"] }
