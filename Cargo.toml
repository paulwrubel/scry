[package]
name = "scry"
version = "0.24.0"
edition = "2024"

[dependencies]
anstream = "1"
anstyle = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
twox-hash = "2.1.4"
num_enum = "0.7.6"
rmcp = { version = "3.5.1", features = [
    "server",
    "macros",
    "schemars",
    "transport-io",
    "transport-streamable-http-server",
] }
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["typed-header"] }
tower-http = { version = "0.6", features = ["cors"] }
subtle = "2"
scry-core = { path = "crates/scry-core" }
scry-postgres = { path = "crates/scry-postgres" }

[workspace]
members = [
    "crates/scry-core",
    "crates/scry-postgres",
]
resolver = "3"

[dev-dependencies]
assert_fs = "1.1.4"
