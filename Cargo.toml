[package]
name = "scry"
version.workspace = true
edition.workspace = true

[dependencies]
anstream = "1"
anstyle = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-native-roots",
    "system-proxy",
] }
scry-core = { path = "crates/scry-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
uuid = "1"

[workspace]
members = ["crates/scry-core", "crates/scry-api"]
resolver = "3"

[workspace.package]
version = "0.33.0"
edition = "2024"

[dev-dependencies]
assert_fs = "1.1.4"
