[package]
name = "scry"
version = "0.23.2"
edition = "2024"

[dependencies]
anstream = "1"
anstyle = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
indoc = "2.0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
ratatui = "0.30"
ratatui-textarea = "0.9"
twox-hash = "2.1.4"
itertools = "0.15.0"
num_enum = "0.7.6"
strum = "0.28.0"
rmcp = { version = "3.5.1", features = [
    "server",
    "macros",
    "schemars",
    "transport-io",
    "transport-streamable-http-server",
] }
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["typed-header"] }
tower-http = { version = "0.6", features = ["cors"] }
subtle = "2"
scry-core = { path = "crates/scry-core" }
scry-sqlite = { path = "crates/scry-sqlite" }
scry-postgres = { path = "crates/scry-postgres" }
scry-remote = { path = "crates/scry-remote" }

[workspace]
members = [
    "crates/scry-core",
    "crates/scry-sqlite",
    "crates/scry-postgres",
    "crates/scry-remote",
]
resolver = "3"

[dev-dependencies]
assert_cmd = "2.2.2"
assert_fs = "1.1.4"
predicates = "3.1.4"
regex = "1.13.1"
tower = { version = "0.5.3", features = ["util"] }
