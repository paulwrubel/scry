[package]
name = "scry-remote"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
scry-core = { path = "../scry-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
