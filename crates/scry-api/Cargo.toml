[package]
name = "scry-api"
version.workspace = true
edition.workspace = true

[features]
default = ["embed-ui"]
ts = ["dep:ts-rs", "scry-core/ts"]
embed-ui = ["dep:include_dir"]

[dependencies]
async-trait = "0.1"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie-key-expansion", "cookie-signed", "typed-header"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
include_dir = { version = "0.7.4", optional = true }
jsonwebtoken = "9.3.1"
scry-core = { path = "../scry-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "chrono", "json", "migrate", "tls-rustls", "uuid"] }
subtle = "2"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
ts-rs = { version = "12", optional = true, features = ["chrono-impl", "uuid-impl"] }
uuid = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
